# Opt-in phone camera testing. No LAN port or local certificates required.
services:
  hub:
    environment:
      HUB_PUBLIC_HOST: ${HUB_TUNNEL_HOST:-localhost}
  backend:
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend},${HUB_TUNNEL_HOST:-localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${HUB_TUNNEL_HOST:-localhost}
  hub-tunnel:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set your private ngrok authtoken in the root .env}
    volumes:
      - ./infrastructure/ngrok/agent.yml:/etc/ngrok/agent.yml:ro
    # ngrok automatically selects the account's stable development domain.
    command: ["http", "--config=/etc/ngrok/agent.yml", "--pooling-enabled=true", "--inspect=false", "--log=stdout", "--log-format=json", "http://hub:5174"]
    depends_on:
      hub:
        condition: service_started
