# Opt-in, temporary HTTPS testing. Never use this as production hosting.
services:
  hub:
    environment:
      HUB_PUBLIC_HOST: ${HUB_TUNNEL_HOST:-}
  kiosk:
    environment:
      KIOSK_PUBLIC_HOST: ${KIOSK_TUNNEL_HOST:-}
      KIOSK_TEST_ACCESS_PASSWORD: ${KIOSK_TEST_ACCESS_PASSWORD:-}
  backend:
    environment: &tunnel-backend
      DJANGO_SETTINGS_MODULE: config.settings.tunnels
      HUB_TUNNEL_HOST: ${HUB_TUNNEL_HOST:-}
      KIOSK_TUNNEL_HOST: ${KIOSK_TUNNEL_HOST:-}
      KIOSK_PUBLIC_BASE_URL: ${KIOSK_PUBLIC_BASE_URL:-}
  order-worker:
    environment: *tunnel-backend
  # No depends_on: recreating apps must not recreate tunnels and change their URLs.
  hub-tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "127.0.0.1:20241", "--url", "http://hub:5174"]
  kiosk-tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "127.0.0.1:20241", "--url", "http://kiosk:5173"]
